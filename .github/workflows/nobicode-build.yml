name: NobiCode Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Restore signing keystore
        env:
          NOBICODE_KEYSTORE_BASE64: ${{ secrets.NOBICODE_KEYSTORE_BASE64 }}
          NOBICODE_KEYSTORE_PASSWORD: ${{ secrets.NOBICODE_KEYSTORE_PASSWORD }}
          NOBICODE_KEY_ALIAS: ${{ secrets.NOBICODE_KEY_ALIAS }}
          NOBICODE_KEY_PASSWORD: ${{ secrets.NOBICODE_KEY_PASSWORD }}
        run: |
          if [ -z "$NOBICODE_KEYSTORE_BASE64" ]; then
            echo "No signing keystore secret set, skipping restore"
            exit 0
          fi
          echo "$NOBICODE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nobicode.p12"
          echo "NOBICODE_KEYSTORE_FILE=$RUNNER_TEMP/nobicode.p12" >> "$GITHUB_ENV"
          echo "NOBICODE_KEYSTORE_PASSWORD=$NOBICODE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NOBICODE_KEY_ALIAS=$NOBICODE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NOBICODE_KEY_PASSWORD=$NOBICODE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          npm install
          npm install -g cordova
          npm run setup

      - name: Build debug APK (paid variant, ads removed)
        run: |
          node utils/storage_manager.mjs y
          npm run build paid dev apk

      - name: Print APK signing cert
        run: |
          APK=platforms/android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/lib/android-sdk /opt/android-sdk -name apksigner 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs "$APK"; else echo "apksigner not found, skipping cert print"; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: NobiCode-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
